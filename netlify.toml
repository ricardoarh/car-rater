[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app uses hash routing, so no SPA rewrite is needed — but this keeps
# deep links working if you ever switch to history routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or the shell; the hashed assets are immutable.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
